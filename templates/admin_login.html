{% extends 'base.html' %}
{% block title %}Admin Login - University Admission System{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow p-4 border-dark">

                <!-- Admin Icon -->
                <div class="text-center mb-4">
                    <i class="fas fa-user-shield fa-4x text-dark"></i>
                    <h3 class="mt-3 text-dark">Admin Login</h3>
                    <p class="text-muted">University Staff Only</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Admin Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-white">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" name="email" class="form-control"
                            placeholder="Enter admin email" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-white">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control"
                            placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">
                        <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                    </button>
                    <div class="text-center mt-3">
                        <a href="/login/" class="text-muted">
                            <i class="fas fa-arrow-left me-1"></i>Go to Student Login
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
